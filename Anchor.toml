[toolchain]
anchor_version = "0.30.1"

[features]
seeds = false
skip-lint = false

# Localnet/testy = build BEZ feature sieciowego = testowy Program ID (R7.2 A;
# keypair poza repo: target/test-program-id.json). Zrodlem prawdy jest declare_id! w lib.rs.
[programs.localnet]
anl_staking = "ChG81WApHgpbWjt4r8wmJ57WS3MkXyMGzJ2tBbC8pcov"

# Testnet X1 (build: scripts/build-testnet.sh, feature network-testnet) - wdrozony program.
[programs.testnet]
anl_staking = "4Cpxg8U3pQWzjMYmoyQgjep9UcMw4DtK7V5tYhmHTVRM"

# Mainnet: placeholder bez keypaira — do ceremonii Program ID
[programs.mainnet]
anl_staking = "CvvG4xQq1w4gYRSidZZ3CzcGcGzaD9LprYjh9XEoMbWC"

[registry]
url = "https://api.apr.dev"

[provider]
# Localnet do testów; docelowo RPC X1 Network (x1.xyz)
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.spec.ts"
