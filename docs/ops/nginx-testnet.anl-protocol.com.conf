server {
    server_name testnet.anl-protocol.com;
    root /var/www/anl-testnet;
    location = /en.html { return 301 /; }
    index index.html;
    location / { try_files $uri $uri/ =404; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/testnet.anl-protocol.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/testnet.anl-protocol.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = testnet.anl-protocol.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name testnet.anl-protocol.com;
    return 404; # managed by Certbot


}